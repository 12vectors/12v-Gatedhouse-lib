[package]
name = "gatedhouse"
version = "0.3.0"
edition = "2021"
description = "Embedded authorization library — Rust SDK"
license = "MIT"
repository = "https://github.com/12vectors/12v-Gatedhouse-lib"
keywords = ["authorization", "rbac", "permissions", "postgres", "jwt"]
categories = ["authentication"]
rust-version = "1.74"
# Not shipped: test fixtures (a throwaway RSA key) and the smoke-test example.
exclude = ["tests/data/*", "examples/*"]

[dependencies]
# Postgres driver (sync; matches Java/Python SDKs which are sync).
# `with-uuid-1` enables `Uuid: ToSql` so we can bind library-generated UUIDs.
postgres = { version = "0.19", features = ["with-uuid-1"] }

# UUID generation for library-owned PKs.
uuid = { version = "1", features = ["v4"] }

# JWT verification (RS256 + JWK parsing). Rust has no JWT in stdlib.
jsonwebtoken = "9"

# Sync HTTP client used solely to fetch JWKS. Rust stdlib has no HTTP.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

# JSON parsing for JWKS responses and JWT custom claims.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OPTIONAL connection pool (feature `r2d2`): makes an r2d2 pool usable as a
# Database, and provides PooledDatabase::from_url (Gatedhouse-owned pool,
# recommended for dev/staging). Hosts passing their own pool via
# database::from_fn never need it.
r2d2 = { version = "0.8", optional = true }
r2d2_postgres = { version = "0.18", optional = true }

[features]
r2d2 = ["dep:r2d2", "dep:r2d2_postgres"]

[[bin]]
name = "gatedhouse-migrate"
path = "src/bin/migrate.rs"

[[example]]
name = "smoke_test"
# Development tool, not shipped as a binary. Runs through
# PooledDatabase::from_url, so it exercises the Gatedhouse-owned pool:
#   cargo run --features r2d2 --example smoke_test -- <conninfo>
required-features = ["r2d2"]
